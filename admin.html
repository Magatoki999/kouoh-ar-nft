<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <title>香訪 管理画面</title>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --gold:#D4AF37; --dark:#0d0900; --surface:rgba(255,255,255,0.04); --border:rgba(212,175,55,0.25); --dim:rgba(255,255,255,0.45); --red:#ff6b6b; --green:#6bffb8; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ background:var(--dark); color:#e8d8c0; font-family:'Kaisei Decol',serif; min-height:100%; }
    #login-screen{ position:fixed; inset:0; background:var(--dark); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; gap:16px; }
    #login-screen h1{ font-size:22px; color:var(--gold); letter-spacing:5px; margin-bottom:8px; }
    #login-screen p{ font-size:12px; color:var(--dim); letter-spacing:1px; }
    #pw-input{ -webkit-appearance:none; appearance:none; width:260px; background:rgba(255,255,255,0.07); border:1px solid var(--border); border-radius:10px; padding:12px 16px; color:#e8d8c0; font-size:15px; outline:none; font-family:'Kaisei Decol',serif; text-align:center; letter-spacing:3px; }
    #pw-input:focus{ border-color:var(--gold); }
    #login-btn{ width:260px; background:linear-gradient(135deg,#b8962e,var(--gold)); border:none; border-radius:10px; color:var(--dark); font-family:'Kaisei Decol',serif; font-size:15px; font-weight:bold; padding:13px; cursor:pointer; letter-spacing:2px; }
    #login-error{ font-size:12px; color:var(--red); min-height:18px; }
    #main-screen{ display:none; }
    #admin-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--dark); z-index:10; }
    #admin-header h1{ font-size:18px; color:var(--gold); letter-spacing:4px; }
    #logout-btn{ font-size:12px; color:var(--dim); cursor:pointer; background:none; border:1px solid var(--border); border-radius:20px; padding:5px 14px; font-family:'Kaisei Decol',serif; }
    #tabs{ display:flex; border-bottom:1px solid var(--border); overflow-x:auto; position:sticky; top:57px; background:var(--dark); z-index:9; }
    .tab{ flex-shrink:0; padding:12px 18px; font-size:13px; cursor:pointer; letter-spacing:1px; color:rgba(255,255,255,0.4); border-bottom:2px solid transparent; transition:all 0.2s; white-space:nowrap; }
    .tab.active{ color:var(--gold); border-bottom-color:var(--gold); }
    .panel{ display:none; padding:20px; max-width:960px; margin:0 auto; padding-bottom:60px; }
    .panel.active{ display:block; }
    .summary-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:24px; }
    .summary-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; text-align:center; }
    .summary-card .s-label{ font-size:11px; color:var(--dim); letter-spacing:1px; margin-bottom:6px; }
    .summary-card .s-value{ font-size:24px; color:var(--gold); font-weight:bold; }
    .summary-card .s-sub{ font-size:11px; color:var(--dim); margin-top:3px; }
    .table-wrap{ overflow-x:auto; border-radius:12px; border:1px solid var(--border); }
    table{ width:100%; border-collapse:collapse; font-size:12px; }
    thead tr{ background:rgba(212,175,55,0.08); }
    th{ padding:10px 12px; text-align:left; font-size:11px; letter-spacing:1px; color:var(--dim); white-space:nowrap; border-bottom:1px solid var(--border); }
    td{ padding:10px 12px; border-bottom:1px solid rgba(255,255,255,0.05); vertical-align:middle; white-space:nowrap; }
    tr:hover td{ background:rgba(255,255,255,0.02); }
    .badge{ display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; }
    .badge-ok{ background:rgba(107,255,184,0.12); color:var(--green); border:1px solid rgba(107,255,184,0.3); }
    .badge-ng{ background:rgba(255,107,107,0.12); color:var(--red); border:1px solid rgba(255,107,107,0.3); }
    .badge-pend{ background:rgba(255,255,255,0.08); color:var(--dim); border:1px solid rgba(255,255,255,0.15); }
    .mono{ font-family:monospace; font-size:11px; color:rgba(255,255,255,0.45); }
    .truncate{ max-width:140px; overflow:hidden; text-overflow:ellipsis; }
    #load-more-btn{ display:none; margin:16px auto 0; padding:11px 40px; border:1px solid var(--border); border-radius:30px; background:none; color:var(--dim); cursor:pointer; font-size:13px; font-family:'Kaisei Decol',serif; }
    .stats-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
    .stats-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; }
    .stats-card h3{ font-size:12px; color:var(--dim); letter-spacing:1px; margin-bottom:12px; }
    .bar-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .bar-label{ font-size:12px; min-width:60px; }
    .bar-track{ flex:1; height:6px; background:rgba(255,255,255,0.08); border-radius:3px; }
    .bar-fill{ height:100%; border-radius:3px; background:var(--gold); transition:width 0.4s ease; }
    .bar-count{ font-size:11px; color:var(--dim); min-width:30px; text-align:right; }
    #daily-chart{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; }
  </style>
</head>
<body>

<div id="login-screen">
  <h1>香訪 AR</h1>
  <p>管理システム</p>
  <input type="password" id="pw-input" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter')login()">
  <button id="login-btn" onclick="login()">認証</button>
  <div id="login-error"></div>
</div>

<div id="main-screen">
  <div id="admin-header">
    <h1>管理ダッシュボード</h1>
    <button id="logout-btn" onclick="logout()">ログアウト</button>
  </div>
  <div id="tabs">
    <div class="tab active" onclick="switchTab(event, 'tab-stats')">統計情報</div>
    <div class="tab" onclick="switchTab(event, 'tab-payments')">決済一覧</div>
    <div class="tab" onclick="switchTab(event, 'tab-users')">顧客リスト</div>
  </div>
  <div id="tab-stats" class="panel active">
    <div id="stats-container"><div style="text-align:center;color:var(--dim);margin-top:40px;">集計データを読み込み中...</div></div>
  </div>
  <div id="tab-payments" class="panel">
    <div class="summary-row" id="sales-summary"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>日時</th><th>ステータス</th><th>商品</th><th>金額</th><th>メールアドレス</th><th>環境</th><th>NFT</th><th>TX</th></tr></thead>
        <tbody id="payments-tbody"></tbody>
      </table>
    </div>
    <button id="load-more-btn" onclick="loadPayments()">さらに読み込む</button>
  </div>
  <div id="tab-users" class="panel">
    <div class="table-wrap">
      <table>
        <thead><tr><th>メールアドレス</th><th style="text-align:center">購入回数</th><th>累計金額</th><th>最終購入</th><th style="text-align:center">所持NFT</th></tr></thead>
        <tbody id="users-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  var SEASON_JP = { spring:'春', summer:'夏', autumn:'秋', winter:'冬' };
  var WEATHER_JP = { clear:'晴れ', rain:'雨', snow:'雪' };
  var TIME_JP = { morning:'朝', midday:'昼', evening:'夕方', night:'夜' };
  var SEASON_EMOJI = { spring:'🌸', summer:'🌿', autumn:'🍂', winter:'❄️' };
  var WEATHER_EMOJI = { clear:'☀️', rain:'🌧', snow:'❄️' };
  var TIME_EMOJI = { morning:'🌅', midday:'☀️', evening:'🌇', night:'🌙' };
  
  var _password = localStorage.getItem('kouoh_admin_pw') || '';
  var _payments = []; 
  var _lastId = null;
  var _hasMore = false;

  function escH(s) { return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function fmtDate(unixtime) {
    if (!unixtime) return '—';
    var d = new Date(unixtime * 1000);
    return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0') + ' ' +
           String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function fmtYen(num) { return '¥' + Number(num).toLocaleString(); }

  function login() {
    var pw = document.getElementById('pw-input').value;
    if (!pw) return;
    document.getElementById('login-btn').innerText = '...';
    // ★ &t=Date.now() で強制キャッシュ回避
    fetch('/api/admin?action=verify&password=' + encodeURIComponent(pw) + '&t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          _password = pw;
          localStorage.setItem('kouoh_admin_pw', pw);
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('main-screen').style.display = 'block';
          loadStats();
          loadPayments(true);
        } else {
          throw new Error(data.error || 'ログイン失敗');
        }
      })
      .catch(e => {
        document.getElementById('login-btn').innerText = '認証';
        document.getElementById('login-error').innerText = e.message;
      });
  }

  function logout() { localStorage.removeItem('kouoh_admin_pw'); location.reload(); }

  if (_password) { document.getElementById('pw-input').value = _password; login(); }

  function switchTab(e, id) {
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
    if (e && e.currentTarget) e.currentTarget.classList.add('active');
    document.getElementById(id).classList.add('active');
  }

  function summaryCard(label, value, sub) {
    return '<div class="summary-card"><div class="s-label">' + label + '</div><div class="s-value">' + value + '</div><div class="s-sub">' + sub + '</div></div>';
  }

  function barCard(title, data, labelMap, emojiMap) {
    if (!data) return '';
    var total = Object.values(data).reduce((s,v) => s+v, 0);
    var order = Object.keys(labelMap);
    var html = '<div class="stats-card"><h3>' + title + '</h3>';
    order.forEach(k => {
      if (k === 'unknown' || k === '') return;
      var cnt = data[k] || 0;
      var maxCnt = Math.max.apply(null, order.map(k2 => data[k2] || 0));
      var pct = maxCnt > 0 ? Math.max(cnt > 0 ? 8 : 3, Math.round(cnt / maxCnt * 100)) : 3;
      var fillOpacity = cnt > 0 ? '1' : '0.25';
      html += '<div class="bar-row"><div class="bar-label">' + (emojiMap[k]||'') + ' ' + (labelMap[k]||k) + '</div>'
        + '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;opacity:' + fillOpacity + '"></div></div>'
        + '<div class="bar-count">' + (title.includes('売上') ? fmtYen(cnt) : cnt) + '</div></div>';
    });
    html += '</div>';
    return html;
  }

  function renderStats(data) {
    var container = document.getElementById('stats-container');
    var html = '<div class="stats-grid">';
    html += summaryCard('総売上', '¥' + data.totalAmount.toLocaleString(), '累計決済金額');
    html += summaryCard('総決済数', data.totalCount + ' 件', '成功した決済の合計');
    html += summaryCard('NFT発行数', data.nftMintedCount + ' 枚', 'ミント完了済み');
    html += '</div><div class="stats-grid">';
    
    var productLabels = { '空蝉': '空蝉', '夕顔': '夕顔' };
    var productEmojis = { '空蝉': '🌿', '夕顔': '💜' };
    html += barCard('香り別 (件数)', data.byProduct || {}, productLabels, productEmojis);
    html += barCard('香り別 (売上)', data.amountByProduct || {}, productLabels, productEmojis);

    html += barCard('季節別', data.bySeason, { spring:'春', summer:'夏', autumn:'秋', winter:'冬' }, { spring:'🌸', summer:'🌿', autumn:'🍂', winter:'❄️' });
    html += barCard('時間帯別', data.byTimeOfDay, { morning:'朝', midday:'昼', evening:'夕方', night:'夜' }, { morning:'🌅', midday:'☀️', evening:'🌇', night:'🌙' });
    html += '</div><div id="daily-chart"><h3>直近の売上推移</h3><div style="margin-top:16px;">';
    
    var days = Object.keys(data.daily || {}).sort();
    if(days.length === 0) { html += '<div style="color:var(--dim);font-size:12px;">データがありません</div>'; } 
    else {
      var maxDaily = Math.max.apply(null, days.map(d => data.daily[d].amount));
      days.forEach(d => {
        var am = data.daily[d].amount;
        var pct = maxDaily > 0 ? Math.max(1, Math.round(am / maxDaily * 100)) : 1;
        html += '<div class="bar-row"><div class="bar-label" style="min-width:80px;">' + d.substring(5) + '</div>'
          + '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;"></div></div>'
          + '<div class="bar-count" style="min-width:60px;">' + fmtYen(am) + '</div></div>';
      });
    }
    html += '</div></div>';
    container.innerHTML = html;
  }

  function loadStats() {
    // ★ &t=Date.now() で強制キャッシュ回避
    fetch('/api/admin?action=stats&password=' + encodeURIComponent(_password) + '&t=' + Date.now())
      .then(r => r.json())
      .then(data => { if(data.error) throw new Error(data.error); renderStats(data); })
      .catch(e => console.error(e));
  }

  function renderPayments() {
    var succeeded = _payments.filter(p => p.status === 'succeeded');
    var total = succeeded.reduce((s,p) => s + p.amount, 0);
    
    document.getElementById('sales-summary').innerHTML = 
      summaryCard('総売上', fmtYen(total), succeeded.length + '件') + 
      summaryCard('決済件数', succeeded.length + '件', _payments.length + '件（全ステータス）') + 
      summaryCard('NFT発行数', succeeded.filter(p => p.nftMinted).length + '件', '発行済') + 
      summaryCard('平均単価', succeeded.length ? fmtYen(Math.round(total/succeeded.length)) : '—', '1件あたり');

    var rows = _payments.map(p => {
      var st = p.status === 'succeeded' ? '<span class="badge badge-ok">完了</span>' : '<span class="badge badge-ng">' + p.status + '</span>';
      var nft = p.nftMinted ? '<span class="badge badge-ok">発行済</span>' : '<span class="badge badge-pend">未発行</span>';
      var tx = p.txHash ? '<a href="https://sepolia.etherscan.io/tx/' + p.txHash + '" target="_blank" class="mono truncate" style="color:var(--gold);text-decoration:none;">' + p.txHash.substring(0,10) + '...</a>' : '<span class="mono">—</span>';
      var env = (SEASON_EMOJI[p.season]||'') + (WEATHER_EMOJI[p.weather]||'') + (TIME_EMOJI[p.timeOfDay]||'');
      return '<tr><td>' + fmtDate(p.created) + '</td><td>' + st + '</td><td>' + escH(p.product) + '</td><td>' + fmtYen(p.amount) + '</td><td>' + escH(p.email) + '</td><td>' + env + '</td><td>' + nft + '</td><td>' + tx + '</td></tr>';
    }).join('');
    
    document.getElementById('payments-tbody').innerHTML = rows;
    renderUsers();
  }

  function loadPayments(reset) {
    if (reset) { _payments = []; _lastId = null; _hasMore = false; }
    // ★ &t=Date.now() で強制キャッシュ回避
    var url = '/api/admin?action=payments&limit=50&password=' + encodeURIComponent(_password) + '&t=' + Date.now();
    if (_lastId) url += '&starting_after=' + _lastId;

    var btn = document.getElementById('load-more-btn');
    btn.style.display = 'none';

    fetch(url)
      .then(r => r.json())
      .then(data => {
        if(data.error) throw new Error(data.error);
        _payments = _payments.concat(data.data);
        _hasMore = data.has_more;
        _lastId = data.last_id;
        renderPayments();
        if (_hasMore) { btn.style.display = 'block'; btn.innerText = 'さらに読み込む'; }
      })
      .catch(e => console.error(e));
  }

  function renderUsers() {
    var map = {};
    _payments.forEach(p => {
      if(p.status !== 'succeeded') return;
      var email = p.email || 'unknown';
      if(!map[email]) map[email] = { count: 0, amount: 0, lastDate: 0, nftCount: 0 };
      map[email].count++; map[email].amount += p.amount;
      if(p.created > map[email].lastDate) map[email].lastDate = p.created;
      if(p.nftMinted) map[email].nftCount++;
    });

    var sorted = Object.keys(map).sort((a,b) => map[b].amount - map[a].amount);
    var rows = sorted.map(email => {
      var m = map[email];
      return '<tr><td>' + escH(email) + '</td><td style="text-align:center">' + m.count + '回</td><td>' + fmtYen(m.amount) + '</td><td>' + fmtDate(m.lastDate) + '</td><td style="text-align:center">' + (m.nftCount > 0 ? '<span class="badge badge-ok">' + m.nftCount + '件</span>' : '<span class="badge badge-pend">0</span>') + '</td></tr>';
    }).join('');
    document.getElementById('users-tbody').innerHTML = rows;
  }
</script>
</body>
</html>
