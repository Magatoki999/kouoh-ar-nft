<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta charset="utf-8">
  <title>香訪 (Kouoh) AR Viewer — both</title>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
  
  <script>
    AFRAME.registerSystem('draco-init', {
      init: function() {
        var renderer = this.el.renderer;
        if (!renderer) return;
        var loader = new THREE.DRACOLoader();
        loader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.preload();
        // A-FrameのGLTFLoaderに適用
        var gltfSystem = this.el.systems['gltf-model'];
        if (gltfSystem && gltfSystem.loader) {
          gltfSystem.loader.setDRACOLoader(loader);
        }
      }
    });

    // ── 2枚同時認識時のセンター位置計算コンポーネント（超シンプル版） ──
    AFRAME.registerComponent('midpoint-tracker', {
      tick: function() {
        var el1 = document.getElementById('target-utsusemi');
        var el2 = document.getElementById('target-yugao');

        var isBothFound = (window.foundTargets && window.foundTargets.utsusemi && window.foundTargets.yugao);

        // 両方見えていない場合は計算をストップ
        if (!isBothFound || !el1 || !el2) return;

        // 1. まず現実空間の絶対座標を取得
        var p1 = new THREE.Vector3();
        var p2 = new THREE.Vector3();
        el1.object3D.getWorldPosition(p1);
        el2.object3D.getWorldPosition(p2);

        // 2. 現実空間での2枚の「真ん中の位置」を計算
        var midWorld = new THREE.Vector3().lerpVectors(p1, p2, 0.5);

        // 3. 【重要】その真ん中の位置を、「空蝉のカードから見た位置（ローカル座標）」に変換
        el1.object3D.worldToLocal(midWorld);

        // 4. 水平方向（X軸）のズレだけを適用。YとZは子要素の<a-plane>側で固定
        this.el.object3D.position.set(midWorld.x, 0, 0);
      }
    });
  </script>
  <style>
    html,body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: -1 !important;
    }
    .a-canvas {
      z-index: 1 !important;
      background: transparent !important;
    }
    a-scene .a-enter-vr-button,
    a-scene .a-enter-ar-button {
      display: none;
    }
    :root {
      --gold: #D4AF37;
      --dark: #1a1208;
    }

    /* ── スタートオーバーレイ ── */
    #start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: #fff;
      text-align: center;
      font-family: 'Kaisei Decol', serif;
      transition: opacity 1.2s ease;
      gap: 16px;
    }
    #start-overlay h1 {
      font-size: 24px;
      color: var(--gold);
      letter-spacing: 6px;
      margin: 0;
    }
    #start-overlay p {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      line-height: 2;
      margin: 0;
      letter-spacing: 1px;
    }

    /* ── NFT確認UI ── */
    #nft-check-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212,175,55,0.4);
      border-radius: 14px;
      padding: 18px;
      width: 280px;
      text-align: center;
      margin-top: 16px;
    }
    #nft-check-box p {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 12px;
      letter-spacing: 1px;
      line-height: 1.8;
    }
    #nft-check-btn {
      width: 100%;
      background: rgba(212,175,55,0.15);
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 10px;
      color: var(--gold);
      font-family: 'Kaisei Decol', serif;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    #nft-status {
      font-size: 12px;
      color: rgba(212,175,55,0.7);
      min-height: 18px;
      margin-top: 6px;
    }

    /* ── スキャンオーバーレイ ── */
    #scan-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9990;
      pointer-events: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #scan-msg {
      color: rgba(255,255,255,0.85);
      font-family: 'Kaisei Decol', serif;
      font-size: 15px;
      letter-spacing: 2px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    #scan-frame {
      margin-top: 16px;
      width: 200px;
      height: 200px;
      border: 2px solid rgba(212,175,55,0.7);
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(212,175,55,0.3);
    }

    /* ── キャプチャボタン ── */
    #capture-btn {
      display: none;
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9998;
      background: var(--gold);
      color: #000;
      padding: 15px 40px;
      border-radius: 30px;
      border: 1px solid #FFF;
      font-family: 'Kaisei Decol', serif;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      cursor: pointer;
      white-space: nowrap;
    }

    /* ── NFT所持者バッジ ── */
    #holder-badge {
      display: none;
      position: fixed;
      bottom: 100px;
      right: 10px;
      z-index: 9997;
      font-size: 10px;
      color: rgba(212,175,55,0.75);
      font-family: monospace;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 6px;
      padding: 3px 8px;
      pointer-events: none;
      white-space: nowrap;
    }


    /* ── 縦書き日付・天気オーバーレイ ── */
    #tategaki-date {
      display: none;
      position: fixed;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 9996;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: 'Kaisei Decol', serif;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.88);
      text-shadow:
        0 0 8px rgba(212,175,55,0.6),
        1px 1px 3px rgba(0,0,0,0.9),
        -1px -1px 3px rgba(0,0,0,0.9);
      letter-spacing: 4px;
      line-height: 1.2;
      pointer-events: none;
      white-space: nowrap;
    }
    #tategaki-weather {
      display: none;
      position: fixed;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 9996;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: 'Kaisei Decol', serif;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.88);
      text-shadow:
        0 0 8px rgba(212,175,55,0.6),
        1px 1px 3px rgba(0,0,0,0.9),
        -1px -1px 3px rgba(0,0,0,0.9);
      letter-spacing: 4px;
      line-height: 1.2;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ── BGM ON/OFF トグルボタン ── */
    #bgm-toggle-btn {
      display: none;
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9997;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(212,175,55,0.4);
      border-radius: 20px;
      padding: 6px 12px;
      color: rgba(255,255,255,0.85);
      font-family: 'Kaisei Decol', serif;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    #bgm-toggle-btn:active {
      background: rgba(212,175,55,0.3);
    }

    /* ── いいねボタン ── */
    #like-btn {
      display: none;
      position: fixed;
      bottom: 100px;
      left: 16px;
      z-index: 9997;
      background: transparent;
      border: none;
      padding: 8px 14px;
      font-family: 'Kaisei Decol', serif;
      color: #fff;
      cursor: pointer;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease;
    }
    #like-btn:active {
      transform: scale(0.88);
    }
    #like-btn .like-heart {
      font-size: 26px;
      line-height: 1;
    }
    #like-btn .like-count {
      font-size: 16px;
      font-weight: bold;
      min-width: 24px;
      text-align: left;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    /* ── ハートエフェクト ── */
    .heart-burst {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 20px;
      animation: heart-fly 0.8s ease-out forwards;
    }
    @keyframes heart-fly {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx),var(--dy)) scale(0.4); }
    }

    /* ── ボイスボタン ── */
    #voice-btn {
      display: none;
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9997;
      background: rgba(0,0,0,0.6);
      border: 1.5px solid rgba(212,175,55,0.6);
      border-radius: 24px;
      padding: 8px 20px;
      font-family: 'Kaisei Decol', serif;
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      cursor: pointer;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    #voice-btn.playing {
      background: rgba(212,175,55,0.2);
      border-color: var(--gold);
      color: var(--gold);
    }
    #voice-btn .voice-icon {
      font-size: 16px;
      line-height: 1;
    }
    @keyframes voice-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    #voice-btn.playing .voice-icon {
      animation: voice-pulse 1.2s ease-in-out infinite;
    }

    /* ── 結果モーダル ── */
    #result-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.98);
      z-index: 10000;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      padding: 24px 16px 80px;
      font-family: 'Kaisei Decol', serif;
    }
    #result-modal h2 {
      color: var(--gold);
      margin: 0;
      letter-spacing: 4px;
      font-size: 20px;
    }
    #result-image {
      max-width: 90%;
      max-height: 40vh;
      border: 2px solid var(--gold);
      margin-top: 12px;
      border-radius: 4px;
    }
    #share-btn {
      margin-top: 14px;
      padding: 12px 40px;
      background: #1DA1F2;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Kaisei Decol', serif;
    }
    #save-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-top: 6px;
      letter-spacing: 1px;
    }
    #close-result-btn {
      margin-top: 28px;
      padding: 12px 60px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 30px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      background: rgba(255,255,255,0.07);
      font-family: 'Kaisei Decol', serif;
    }

    #v-loading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 20000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    #v-loading.show {
      display: flex;
    }
    .v-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(212,175,55,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .v-loading-text {
      font-family: 'Kaisei Decol', serif;
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 2px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div id="start-overlay">
  <h1>香訪 (Kouoh) AR</h1>
  <p>香りの記憶を呼び覚まします</p>

  <div id="nft-check-box">
    <button id="nft-check-btn" onclick="startViewer(false, null)">ARを開始する</button>
    <div id="nft-status"></div>
  </div>
  <p style="font-size:11px;color:rgba(255,255,255,0.25);margin-top:4px;">※ カメラへのアクセスを許可してください</p>
</div>

<div id="tategaki-date"></div>
<div id="tategaki-weather"></div>

<div id="scan-overlay">
  <p id="scan-msg">カードにカメラを向けてください…</p>
  <div id="scan-frame"></div>
</div>

<button id="bgm-toggle-btn">🔇 BGM OFF</button>

<button id="capture-btn">香りの記憶を残す</button>

<div id="holder-badge"></div>

<button id="like-btn">
  <span class="like-heart">🩷</span>
  <span class="like-count" id="like-count">-</span>
</button>

<button id="voice-btn">
  <span class="voice-icon">🔊</span>
  <span id="voice-label">ご挨拶を聞く</span>
</button>

<div id="v-loading">
  <div class="v-spinner"></div>
  <div class="v-loading-text">確認中…</div>
</div>

<div id="result-modal">
  <h2>香りの記憶</h2>
  <img id="result-image" src="" alt="香りの記憶">
  <button id="share-btn" onclick="shareCapture()">SNSで共有する</button>
  <p id="save-hint">画像を長押しして保存してください</p>
  <button id="close-result-btn" onclick="closeResult()">戻る</button>
</div>

<a-scene
  id="ar-scene"
  draco-init
  mindar-image="imageTargetSrc:./both.mind; maxTrack:2; autoStart:true; uiLoading:no; uiScanning:no;"
  color-space="sRGB"
  renderer="colorManagement:true; preserveDrawingBuffer:true; alpha:true; antialias:true;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
>
  <a-assets>
    <a-asset-item id="utsusemiModel"    src="./utsusemi.glb"></a-asset-item>
    <a-asset-item id="utsusemiNFTModel" src="./UtusemiKouahNFT.glb"></a-asset-item>
    <a-asset-item id="yugaoModel"       src="./yugao.glb"></a-asset-item>
    
    <audio id="bgm-ambient" src="./ambient.mp3" preload="auto" loop></audio>
    <audio id="bgm-scene01" src="./scene01.mp3" preload="auto" loop></audio>
    <audio id="bgm-scene02" src="./scene02.mp3" preload="auto" loop></audio>

    <img id="umePetal" src="./ume_petal.png" crossorigin="anonymous">
    
    <canvas id="halo-canvas" width="256" height="256" style="display:none"></canvas>
    <canvas id="speak-canvas" width="128" height="128" style="display:none"></canvas>
    
    <img id="scene01" src="./scene01.png" crossorigin="anonymous">
    <img id="scene02" src="./scene02.png" crossorigin="anonymous">
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity id="target-utsusemi" mindar-image-target="targetIndex:0">

    <a-entity id="bg-container" visible="false" midpoint-tracker>
      <a-plane id="bg-scene01" src="#scene01" position="0 1.2 1.25"  rotation="90 0 0" width="4" height="2.5" material="transparent:true; opacity:1; side:double; shader:flat; depthWrite:false"></a-plane>
      <a-plane id="bg-scene02" src="#scene02" position="0 1.2 1.251" rotation="90 0 0" width="4" height="2.5" material="transparent:true; opacity:0; side:double; shader:flat; depthWrite:false"></a-plane>
    </a-entity>

    <a-entity id="manifestation-utsusemi" visible="false">
      <a-entity id="halo-entity-utsusemi" visible="false">
        <a-plane id="halo-plane-utsusemi"
          position="0 0.2 -0.05"
          width="2.2" height="2.2"
          material="src:#halo-canvas; shader:flat; transparent:true; opacity:0; depthWrite:false; side:double">
        </a-plane>
      </a-entity>
      
      <a-gltf-model id="main-model-utsusemi" src="#utsusemiModel" position="0 0 0" rotation="180 90 110" scale="1.5 1.5 1.5" animation-mixer follow-empty="targetName: Empty; smokeId: smoke-entity-utsusemi"></a-gltf-model>
      <a-gltf-model id="nft-model-utsusemi" src="#utsusemiNFTModel" position="0 0 0" rotation="180 90 110" scale="1.5 1.5 1.5" animation-mixer follow-empty="targetName: Empty; smokeId: smoke-entity-utsusemi" visible="false"></a-gltf-model>
      <a-entity id="smoke-entity-utsusemi"></a-entity>
      <a-entity id="season-entity-utsusemi" position="0 0.1 0.05"></a-entity>
      
      <a-entity id="speak-icon-utsusemi" position="0.7 1.5 1.1" visible="false">
        <a-plane material="src: #speak-canvas; transparent: true; shader: flat; depthWrite: false" 
                 scale="0.6 0.6 0.6" 
                 rotation="90 0 0" 
                 animation="property: position; dir: alternate; dur: 600; loop: true; to: 0 0 0.1; easing: easeInOutSine">
        </a-plane>
      </a-entity>
    </a-entity>
  </a-entity>

  <a-entity id="target-yugao" mindar-image-target="targetIndex:1">
    <a-entity id="manifestation-yugao" visible="false">
      <a-gltf-model id="yugao-model" src="#yugaoModel" position="0 0 0" rotation="180 90 110" scale="1.5 1.5 1.5" animation-mixer follow-empty="targetName: Empty; smokeId: smoke-entity-yugao"></a-gltf-model>
      <a-entity id="smoke-entity-yugao"></a-entity>
      <a-entity id="season-entity-yugao" position="0 0.1 0.05"></a-entity>
      
      <a-entity id="speak-icon-yugao" position="0.7 1.5 1.1" visible="false">
        <a-plane material="src: #speak-canvas; transparent: true; shader: flat; depthWrite: false" 
                 scale="0.6 0.6 0.6" 
                 rotation="90 0 0" 
                 animation="property: position; dir: alternate; dur: 600; loop: true; to: 0 0 0.1; easing: easeInOutSine">
        </a-plane>
      </a-entity>
    </a-entity>
  </a-entity>

</a-scene>

<script>
  var LANG = navigator.language && navigator.language.startsWith('ja') ? 'ja' : 'en';

  // ── 状態変数 ──
  var isNFTHolder   = false;
  var walletAddress = null;
  var audioUnlocked = false;
  var shareFile     = null;
  var selectedChar  = null; 

  // ★ 複数ターゲット管理用変数 ★
  window.foundTargets = { utsusemi: false, yugao: false };
  var activeCount   = 0;
  var prevCount     = 0;

  // キャラ別設定
  var CHAR_CONFIG = {
    utsusemi: { likeParam: 'utsusemi' },
    yugao:    { likeParam: 'yugao' }
  };

  // ★ BGM設定 ★
  var isBgmOn       = false; 
  var BGM_NORM_VOL  = 0.35; // 通常環境音 (少しアップ)
  var BGM_LOW_VOL   = 0.20; // 1枚認識時 (少しアップ)
  var BGM_DUCK_VOL  = 0.15; // 会話中の裏音 (声に負けない15%にアップ！)

  function getEffectiveVol(targetVol) {
    return isBgmOn ? targetVol : 0;
  }

  // ★ BGM管理変数 ★
  var bgm0 = document.getElementById('bgm-ambient');
  var bgm1 = document.getElementById('bgm-scene01');
  var bgm2 = document.getElementById('bgm-scene02');
  var activeBGM = bgm0;
  var activeScene = 0; // 0: ambient, 1: scene01, 2: scene02

  // ── ボイス・会話用変数 ──
  var VOICE_FILES = { utsusemi: './utsusemi_greeting.mp3', yugao: './yugao_greeting.mp3' };
  var voiceAudio     = new Audio();
  voiceAudio.loop    = false;
  var _voicePlaying  = false;
  var _voicePaused   = false;
  var _lastVoiceChar = null;

  var CONV_FILES = [
    './utsusemi_voice_01.mp3',
    './yugao_voice_01.mp3',
    './utsusemi_voice_02.mp3', // ここで背景＆BGMが scene02 に変わる
    './yugao_voice_02.mp3'
  ];
  var convAudio = new Audio();
  convAudio.loop = false;
  var _convPlaying = false;
  var _convPaused = false;
  var convIndex = 0;

  // ── テクスチャをCanvasで生成 ──
  (function buildTextures() {
    var cHalo = document.getElementById('halo-canvas');
    var ctxH = cHalo.getContext('2d');
    var cxH = 128, cyH = 128, rH = 128;
    var grad = ctxH.createRadialGradient(cxH, cyH, 0, cxH, cyH, rH);
    grad.addColorStop(0.0,  'rgba(255, 240, 160, 0.95)'); 
    grad.addColorStop(0.15, 'rgba(212, 175,  55, 0.80)'); 
    grad.addColorStop(0.40, 'rgba(212, 175,  55, 0.35)'); 
    grad.addColorStop(0.70, 'rgba(180, 140,  20, 0.12)');
    grad.addColorStop(1.0,  'rgba(0,   0,     0, 0.00)'); 
    ctxH.fillStyle = grad;
    ctxH.fillRect(0, 0, 256, 256);
    
    ctxH.save();
    ctxH.translate(cxH, cyH);
    for (var i = 0; i < 8; i++) {
      ctxH.rotate(Math.PI / 4);
      var lineGrad = ctxH.createLinearGradient(0, 0, rH, 0);
      lineGrad.addColorStop(0,   'rgba(255, 248, 200, 0.6)');
      lineGrad.addColorStop(0.5, 'rgba(212, 175,  55, 0.2)');
      lineGrad.addColorStop(1,   'rgba(0,   0,     0, 0.0)');
      ctxH.strokeStyle = lineGrad;
      ctxH.lineWidth   = 3;
      ctxH.beginPath();
      ctxH.moveTo(0, 0);
      ctxH.lineTo(rH, 0);
      ctxH.stroke();
    }
    ctxH.restore();

    var cSpeak = document.getElementById('speak-canvas');
    var ctxS = cSpeak.getContext('2d');
    var cxS = 64, cyS = 64;
    ctxS.clearRect(0, 0, 128, 128);
    
    ctxS.fillStyle = 'rgba(255, 255, 255, 0.95)';
    ctxS.beginPath();
    ctxS.moveTo(cxS - 8, cyS + 18);
    ctxS.lineTo(cxS - 18, cyS + 38);
    ctxS.lineTo(cxS + 8, cyS + 18);
    ctxS.fill();
    
    ctxS.beginPath();
    ctxS.arc(cxS, cyS - 8, 32, 0, Math.PI * 2);
    ctxS.fill();
    ctxS.lineWidth = 1.5;
    ctxS.strokeStyle = '#D4AF37'; 
    ctxS.stroke();

    ctxS.fillStyle = '#D4AF37';
    ctxS.beginPath();
    ctxS.arc(cxS - 12, cyS - 8, 3, 0, Math.PI*2);
    ctxS.fill();
    
    ctxS.beginPath();
    ctxS.arc(cxS, cyS - 8, 3, 0, Math.PI*2);
    ctxS.fill();
    
    ctxS.beginPath();
    ctxS.arc(cxS + 12, cyS - 8, 3, 0, Math.PI*2);
    ctxS.fill();

    setTimeout(function() {
      var elH = document.getElementById('halo-plane-utsusemi');
      if (elH && elH.components && elH.components.material) {
        elH.components.material.material.map.needsUpdate = true;
      }
      
      var elSu = document.getElementById('speak-icon-utsusemi');
      if (elSu && elSu.children[0] && elSu.children[0].components.material) {
        elSu.children[0].components.material.material.map.needsUpdate = true;

      var elSy = document.getElementById('speak-icon-yugao');
      if (elSy && elSy.children[0] && elSy.children[0].components.material) {

  // 音量フェード関数
  function fadeAudio(audioNode, target, ms, cb) {
    if (!audioNode) return;
    if (audioNode._fadeRafId) {
      cancelAnimationFrame(audioNode._fadeRafId);
      audioNode._fadeRafId = null;
    }
    var start = audioNode.volume || 0;
    var t0 = performance.now();
    function tick() {
      var p = Math.min(1, (performance.now() - t0) / ms);
      audioNode.volume = start + (target - start) * p;
      if (p < 1) {
        audioNode._fadeRafId = requestAnimationFrame(tick);
      } else {
        audioNode._fadeRafId = null;
        if (cb) cb();
      }
    }
    audioNode._fadeRafId = requestAnimationFrame(tick);
  }

  // ★ BGM切り替え関数
  function switchBGM(targetScene, targetVol, durationMs) {
    var dur = durationMs || 1500;
    var oldBGM = activeScene === 0 ? bgm0 : (activeScene === 1 ? bgm1 : bgm2);
    var newBGM = targetScene === 0 ? bgm0 : (targetScene === 1 ? bgm1 : bgm2);

    var didSwitch = (activeScene !== targetScene);

    if (didSwitch) {
      if (oldBGM) fadeAudio(oldBGM, 0, dur, function() { oldBGM.pause(); });
      newBGM.currentTime = 0; // 曲を頭出し
      activeScene = targetScene;
      activeBGM = newBGM;
    }

    if (isBgmOn) {
      activeBGM.play().catch(function(){}); 
      fadeAudio(activeBGM, targetVol, dur);
    } else {
      fadeAudio(activeBGM, 0, 500, function() { activeBGM.pause(); });
    }
    return didSwitch;
  }


  // ── 和暦変換 ──────────────────────────────────────────────────────
  function toWareki(date) {
    var y = date.getFullYear();
    var m = date.getMonth() + 1;
    var d = date.getDate();
    var nums = ['〇','一','二','三','四','五','六','七','八','九','十',
                '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
                '二十一','二十二','二十三','二十四','二十五','二十六','二十七','二十八','二十九','三十','三十一'];
    var era, yr;
    if (y >= 2019 && (y > 2019 || m >= 5)) {
      era = '令和'; yr = y - 2018;
    } else if (y >= 1989) {
      era = '平成'; yr = y - 1988;
    } else {
      era = '昭和'; yr = y - 1925;
    }
    var yrStr = yr === 1 ? '元' : nums[yr] || String(yr);
    return era + yrStr + '年' + nums[m] + '月' + nums[d] + '日';
  }

  function loadWeather() {

    fetch('https://api.open-meteo.com/v1/forecast?latitude=35.0116&longitude=135.7681&current_weather=true')
      .then(function(r){ return r.json(); })
      .then(function(d){
        var code = d.current_weather.weathercode;
        var wt;
        if (code === 0) wt = '快晴';
        else if (code <= 2) wt = '晴れ';
        else if (code <= 3) wt = '曇り';
        else if (code <= 49) wt = '霧';
        else if (code <= 67) wt = '雨';
        else if (code <= 77) wt = '雪';
        else if (code <= 82) wt = '大雨';
        else if (code <= 86) wt = '大雪';
        else wt = '雷雨';
        var icon = (code === 0) ? '☀' : (code <= 2) ? '🌤' : (code <= 3) ? '☁' :
                   (code <= 49) ? '🌫' : (code <= 67) ? '🌧' : (code <= 77) ? '❄' :
                   (code <= 82) ? '⛈' : (code <= 86) ? '🌨' : '⛈';

  function playConversation(startIndex) {
    if (startIndex !== undefined) convIndex = startIndex;
    
    var bg1 = document.getElementById('bg-scene01');
    var bg2 = document.getElementById('bg-scene02');

    if (convIndex >= CONV_FILES.length) {
      _convPlaying = false; 
      _convPaused = false; 
      convIndex = 0; 
      updateSpeakerIcon(null); 
      // 会話終了後はscene02のまま、BGMを通常音量に引き上げる
      switchBGM(2, BGM_NORM_VOL, 1000);
      updateVoiceBtn(); 
      return;
    }
    
    // 再度最初から再生する場合は背景をscene01に戻す
    if (convIndex === 0 && bg1 && bg2) {
        bg1.setAttribute('animation', 'property: material.opacity; to: 1; dur: 1000; easing: easeInOutQuad');
        bg2.setAttribute('animation', 'property: material.opacity; to: 0; dur: 1000; easing: easeInOutQuad');
    }
    
    if (convIndex === 0 || convIndex === 2) {
      updateSpeakerIcon('utsusemi');
    } else if (convIndex === 1 || convIndex === 3) {
      updateSpeakerIcon('yugao');
    }
    
    var switched = false;
    if (bg1 && bg2) {
      if (convIndex >= 2) {
        bg1.setAttribute('animation', 'property: material.opacity; to: 0; dur: 1200; easing: easeInOutQuad');
        bg2.setAttribute('animation', 'property: material.opacity; to: 1; dur: 1200; easing: easeInOutQuad');
        switched = switchBGM(2, BGM_DUCK_VOL, 800);
      } else {
        switched = switchBGM(1, BGM_DUCK_VOL, 800);
      }
    }

    convAudio.src = CONV_FILES[convIndex];
    convAudio.currentTime = 0;
    convAudio.load();
    
    if (!switched && isBgmOn) {
      if (convIndex === 0 && !_convPaused) {
        fadeAudio(activeBGM, BGM_DUCK_VOL, 600);
      } else if (_convPaused) {
        fadeAudio(activeBGM, BGM_DUCK_VOL, 600);
      }
    }
    
    convAudio.play().then(function() { 
      _convPlaying = true; 
      _convPaused = false; 
      updateVoiceBtn(); 
    }).catch(function(e) { 
      if (isBgmOn) fadeAudio(activeBGM, BGM_NORM_VOL, 600); 
    });

// 🔽 修正後（0.3秒の空白を入れる）
    convAudio.onended = function() {
      convIndex++; 
      setTimeout(function() {
        playConversation();
      }, 300); // 300ミリ秒（0.3秒）待ってから次を再生

  }

  function pauseConversation(isManualStop) {

  AFRAME.registerComponent('incense-smoke', {
    init: function() {
      this.particles = [];
      for (var i = 0; i < 30; i++) {
        var el = document.createElement('a-sphere');
        var isBig = i < 18;
        var r = isBig ? (0.018 + Math.random() * 0.014).toFixed(3) : (0.006 + Math.random() * 0.006).toFixed(3);
        
        el.setAttribute('radius', r);
        el.setAttribute('material', 'shader: flat; transparent: true; opacity: 0; color: #e0d8cc; depthWrite: false');
        this.el.appendChild(el);
        
        this.particles.push({
            el: el,
            life: Math.random(),
            speed: Math.random() * 0.0012 + 0.0005,
            phase: Math.random() * 6.28,
            drift: (Math.random() - 0.5) * 0.04,
            big: isBig
        });
      }
    },
    tick: function(time) {
      this.particles.forEach(function(p) {
        p.life += p.speed;
        if (p.life > 1) {
            p.life = 0;
        }
        
        var sway = Math.sin(time * 0.0015 + p.phase) * 0.04 + p.drift;
        var z = p.life * 1.0;
        p.el.setAttribute('position', sway + ' 0 ' + z.toFixed(3));
        
        var op = p.life < 0.25 ? (p.life / 0.25) * (p.big ? 0.18 : 0.10) : ((1 - p.life) / 0.75) * (p.big ? 0.18 : 0.10);
        p.el.setAttribute('material', 'opacity:' + op.toFixed(3));
      });
    }
  });

  AFRAME.registerComponent('seasonal-effect', {
    init: function() {
      this.particles = [];
      var m = new Date().getMonth() + 1;
      var s = (m >= 3 && m <= 5) ? 'spring' : (m >= 6 && m <= 8) ? 'summer' : (m >= 9 && m <= 11) ? 'autumn' : 'winter';
      this.season = s;
      
      var colors = {
          summer: ['#aaff66', '#88ff44'],
          autumn: ['#cc3300', '#ff6600'],
          winter: ['#ddeeff', '#ffffff']
      };
      
      for (var i = 0; i < 25; i++) {
        var el;
        if (s === 'spring') {
          el = document.createElement('a-plane');
          var sz = (0.04 + Math.random() * 0.04).toFixed(3);
          el.setAttribute('width', sz);
          el.setAttribute('height', sz);
          el.setAttribute('material', 'src: #umePetal; shader: flat; transparent: true; opacity: 0; alphaTest: 0.05; depthWrite: false; side: double');
          el.setAttribute('rotation', '0 0 ' + Math.round(Math.random() * 360));
        } else {
          el = document.createElement('a-sphere');
          el.setAttribute('radius', s === 'summer' ? '0.008' : '0.014');
          var pal = colors[s] || ['#fff'];
          el.setAttribute('material', 'shader: flat; transparent: true; opacity: 0; color: ' + pal[Math.floor(Math.random() * pal.length)] + '; depthWrite: false');
        }
        
        this.el.appendChild(el);
        this.particles.push({
            el: el,
            x: (Math.random() - 0.5) * 0.9,
            z: Math.random() * 1.2,
            y: (Math.random() - 0.5) * 0.2,
            vz: -(Math.random() * 0.002 + 0.001),
            phase: Math.random() * 6.28,
            rotSpd: (Math.random() - 0.5) * 1.5,
            rot: Math.random() * 360,
            life: Math.random(),
            lifeSpd: Math.random() * 0.002 + 0.001
        });
      }
    },
    tick: function(time) {
      var s = this.season;
      this.particles.forEach(function(p) {
        p.life += p.lifeSpd;
        if (p.life > 1) {
            p.life = 0;
            p.z = 1.0;
            p.x = (Math.random() - 0.5) * 0.9;
        }
        
        if (s === 'summer') {
            p.x += Math.sin(time * 0.0015 + p.phase) * 0.003;
            p.z += Math.sin(time * 0.001 + p.phase * 1.3) * 0.002;
        } else {
            p.x += Math.sin(time * 0.001 + p.phase) * 0.002;
            p.z += p.vz;
        }
        
        p.el.setAttribute('position', p.x + ' ' + p.y + ' ' + p.z);
        
        if (s === 'spring') {
            p.rot += p.rotSpd;
            p.el.setAttribute('rotation', '0 0 ' + p.rot.toFixed(1));
        }
        
        var fade = p.life < 0.15 ? p.life / 0.15 : p.life > 0.75 ? (1 - p.life) / 0.25 : 1;
        p.el.setAttribute('material', 'opacity:' + (fade * 0.85).toFixed(3));
      });
    }
  });

  AFRAME.registerComponent('halo-pulse', {
    init: function() {
        this.plane = document.getElementById('halo-plane-utsusemi');
        if (this.plane) {
            this.plane.setAttribute('material', 'src: #halo-canvas; shader: flat; transparent: true; opacity: 0.55; depthWrite: false; side: double');
        }
    },
    tick: function(time) {
      if (!this.plane) return;
      var op = 0.45 + 0.15 * Math.sin(time * 0.0012);
      var sc = 1.0 + 0.025 * Math.sin(time * 0.0008);
      this.plane.setAttribute('material', 'opacity:' + op.toFixed(3));
      this.plane.object3D.scale.set(sc, sc, sc);
    }
  });

  // ── キャプチャ処理 ──
  document.getElementById('capture-btn').addEventListener('click', function() {
    var btn = document.getElementById('capture-btn');
    btn.innerText = '保存中...';

    var sceneEl = document.querySelector('a-scene');
    var video = document.querySelector('video');
    var canvas = sceneEl.canvas;
    var comp = document.createElement('canvas');
    comp.width = canvas.width;
    comp.height = canvas.height;
    
    var ctx = comp.getContext('2d');
    var ratio = Math.max(comp.width / video.videoWidth, comp.height / video.videoHeight);
    var vw = video.videoWidth * ratio;
    var vh = video.videoHeight * ratio;
    
    ctx.drawImage(video, (comp.width - vw) / 2, (comp.height - vh) / 2, vw, vh);
    sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
    ctx.drawImage(canvas, 0, 0);

    var W = comp.width;
    var H = comp.height;
    var dpr = W / window.innerWidth || 2;
    
    var SEASON_LABEL  = { spring: '春', summer: '夏', autumn: '秋', winter: '冬' };
    var SEASON_EMOJI  = { spring: '🌸', summer: '🌿', autumn: '🍂', winter: '❄️' };
    
    var now = new Date();
    var m = now.getMonth() + 1;
    var seasonKey = (m >= 3 && m <= 5) ? 'spring' : (m >= 6 && m <= 8) ? 'summer' : (m >= 9 && m <= 11) ? 'autumn' : 'winter';
    var dateText = now.getFullYear() + '.' + String(now.getMonth() + 1).padStart(2, '0') + '.' + String(now.getDate()).padStart(2, '0');
    
    var lines = [
        (SEASON_EMOJI[seasonKey] || '🌸') + ' ' + (SEASON_LABEL[seasonKey] || '春'),
        '📅 ' + dateText,
        '✦ 香訪 (Kouoh) AR'
    ];
    
    var fs = Math.round(13 * dpr);
    var fsSmall = Math.round(11 * dpr);
    var pad = Math.round(10 * dpr);
    var lineH = Math.round(18 * dpr);
    
    ctx.font = fs + 'px sans-serif';
    var maxW = 0;
    lines.forEach(function(l) {
        var mw = ctx.measureText(l).width;
        if (mw > maxW) {
            maxW = mw;
        }
    });
    
    var panelW = maxW + pad * 2;
    var panelH = lines.length * lineH + pad * 1.5;
    var px = W - panelW - Math.round(12 * dpr);
    var py = H - panelH - Math.round(12 * dpr);
    
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#0d0900';
    roundRect(ctx, px, py, panelW, panelH, Math.round(6 * dpr));
    ctx.fill();
    ctx.restore();
    
    ctx.save();
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = '#D4AF37';
    ctx.lineWidth = Math.round(0.8 * dpr);
    roundRect(ctx, px, py, panelW, panelH, Math.round(6 * dpr));
    ctx.stroke();
    ctx.restore();
    
    ctx.save();
    ctx.globalAlpha = 1;
    lines.forEach(function(line, i) {
      var isLast = (i === lines.length - 1);
      ctx.font = (isLast ? 'bold ' : '') + ((isLast ? fsSmall : fs)) + 'px sans-serif';
      ctx.fillStyle = isLast ? '#D4AF37' : '#ffe8c0';
      ctx.fillText(line, px + pad, py + pad + lineH * (i + 0.85));
    });
    ctx.restore();

    var dataUrl = comp.toDataURL('image/jpeg', 0.85);
    document.getElementById('result-image').src = dataUrl;
    document.getElementById('result-modal').style.display = 'flex';
    
    comp.toBlob(function(blob) {
        shareFile = new File([blob], 'kouoh_viewer.jpg', { type: 'image/jpeg' });
    }, 'image/jpeg');
    
    btn.innerText = '香りの記憶を残す';
  });

  function shareCapture() {
    if (navigator.share && shareFile) {
        navigator.share({
            title: '香訪 (Kouoh) AR',
            text: '#香訪AR #KouohAR',
            files: [shareFile]
        }).catch(function(){});
    } else {
        alert('画像を長押しして保存してください');
    }
  }

  function closeResult() {
      document.getElementById('result-modal').style.display = 'none';
      document.getElementById('result-image').src = '';
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // ── いいねボタン ──
  function showLikeBtn() {
    if (!selectedChar) return;
    var btn = document.getElementById('like-btn');
    btn.style.display = 'flex';
    var param = '?char=' + (CHAR_CONFIG[selectedChar].likeParam);
    
    fetch('/api/like' + param)
      .then(function(r) { return r.json(); })
      .then(function(d) {
          document.getElementById('like-count').textContent = d.total || 0;
      })
      .catch(function() {
          document.getElementById('like-count').textContent = '?';
      });
  }

  document.getElementById('like-btn').addEventListener('click', function() {
    if (!selectedChar) return;
    burstHearts();
    var param = '?char=' + (CHAR_CONFIG[selectedChar].likeParam);
    
    fetch('/api/like' + param, { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function(d) {
          document.getElementById('like-count').textContent = d.total || 0;
      })
      .catch(function() {});
  });

  function burstHearts() {
    var btn = document.getElementById('like-btn');
    var rect = btn.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top  + rect.height / 2;
    var hearts = ['🩷','🩷','💕','🩷','💗','🩷'];
    
    hearts.forEach(function(h, i) {
      var el = document.createElement('div');
      el.className = 'heart-burst';
      el.textContent = h;
      
      var angle = (Math.random() * 280 - 140) * Math.PI / 180;
      var dist  = 50 + Math.random() * 60;
      
      el.style.left = (cx - 12) + 'px';
      el.style.top  = (cy - 12) + 'px';
      el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      el.style.setProperty('--dy', Math.sin(angle) * dist - 20 + 'px');
      el.style.animationDelay = (i * 40) + 'ms';
      el.style.fontSize = (16 + Math.random() * 12) + 'px';
      
      document.body.appendChild(el);
      
      setTimeout(function() {
          el.remove();
      }, 900);
    });
  }
</script>
