<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Debug</title>
  <style>
    body { background:#111; color:#0f0; font-family:monospace; font-size:13px; padding:16px; }
    .err { color:#f55; } .ok { color:#5f5; } .warn { color:#fa0; }
    pre { white-space:pre-wrap; word-break:break-all; }
  </style>
</head>
<body>
<pre id="log">診断中...\n</pre>
<script>
const log = document.getElementById('log');
function p(msg, cls='') {
  const s = document.createElement('span');
  s.className = cls; s.textContent = msg + '\n';
  log.appendChild(s);
}

// グローバルエラーを全部キャッチ
window.onerror = (msg, src, line, col, err) => {
  p(`❌ JS ERROR: ${msg}`, 'err');
  p(`   at ${src}:${line}:${col}`, 'err');
  if (err?.stack) p(err.stack, 'err');
};
window.addEventListener('unhandledrejection', e => {
  p(`❌ UNHANDLED PROMISE: ${e.reason}`, 'err');
});

// 1. 基本チェック
p('=== 環境チェック ===');
p(`UserAgent: ${navigator.userAgent}`);
p(`https: ${location.protocol === 'https:' ? '✅' : '⚠️ ' + location.protocol}`);

// 2. 外部スクリプト読み込みチェック
p('\n=== スクリプト読み込み ===');

const scripts = [
  { name: 'Stripe',     src: 'https://js.stripe.com/v3/',                                               check: () => typeof Stripe !== 'undefined' },
  { name: 'A-Frame',    src: 'https://aframe.io/releases/1.4.2/aframe.min.js',                          check: () => typeof AFRAME !== 'undefined' },
  { name: 'MindAR',     src: 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js', check: () => typeof AFRAME !== 'undefined' },
  { name: 'AF-Extras',  src: 'https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js', check: () => true },
];

let loaded = 0;
function checkAll() {
  scripts.forEach(s => {
    const ok = s.check();
    p(`  ${s.name}: ${ok ? '✅ OK' : '❌ FAILED'}`, ok ? 'ok' : 'err');
  });

  // 3. DOM要素チェック
  p('\n=== DOM要素 ===');
  const ids = ['start-overlay','scan-overlay','capture-btn','result-modal',
               'ai-overlay','ai-log','ai-text-input','ai-mic-btn',
               'kouoh-loading','target0','manifestation'];
  ids.forEach(id => {
    const el = document.getElementById(id) || document.querySelector('#'+id);
    p(`  #${id}: ${el ? '✅' : '❌ 見つからない'}`, el ? 'ok' : 'err');
  });

  // 4. AFRAME コンポーネントチェック
  p('\n=== AFRAMEコンポーネント ===');
  if (typeof AFRAME !== 'undefined') {
    ['incense-smoke','seasonal-effect'].forEach(name => {
      const ok = !!AFRAME.components[name];
      p(`  ${name}: ${ok ? '✅ 登録済み' : '❌ 未登録'}`, ok ? 'ok' : 'err');
    });
  } else {
    p('  AFRAME未定義のためスキップ', 'warn');
  }

  // 5. 環境変数（APIエンドポイント疎通）
  p('\n=== API疎通確認 ===');
  fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' })
    .then(r => p(`  /api/chat: ${r.status} ${r.status === 400 ? '✅ (400=正常到達)' : r.status === 405 ? '✅ (405=メソッドNG=到達)' : r.status === 500 ? '⚠️ サーバーエラー' : '?'}`, r.status < 500 ? 'ok' : 'warn'))
    .catch(e => p(`  /api/chat: ❌ ${e.message}`, 'err'));

  fetch('/api/create-payment', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' })
    .then(r => p(`  /api/create-payment: ${r.status}`, r.status < 500 ? 'ok' : 'warn'))
    .catch(e => p(`  /api/create-payment: ❌ ${e.message}`, 'err'));

  p('\n=== 完了 ===');
  p('上記の ❌ がある箇所が問題の原因です。');
}

// 全スクリプト読み込み後にチェック
window.addEventListener('load', checkAll);
</script>

<!-- 実際のアプリと同じスクリプトを読み込む -->
<script src="https://js.stripe.com/v3/" onerror="p('❌ Stripe 読み込み失敗','err')"></script>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js" onerror="p('❌ AFrame 読み込み失敗','err')"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js" onerror="p('❌ MindAR 読み込み失敗','err')"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js" onerror="p('❌ AFrame-extras 読み込み失敗','err')"></script>
</body>
</html>
