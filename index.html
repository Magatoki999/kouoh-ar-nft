<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香訪 — Kouoh AR</title>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Noto+Sans+JP:wght@200;300;400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:      #D4AF37;
      --gold-dim:  rgba(212,175,55,0.25);
      --gold-glow: rgba(212,175,55,0.08);
      --ink:       #0a0804;
      --ink2:      #13100a;
      --paper:     rgba(232,224,208,0.06);
      --dim:       rgba(232,224,208,0.35);
      --text:      rgba(232,224,208,0.88);
    }

    * { box-sizing:border-box; margin:0; padding:0; }

    html, body {
      width:100%; height:100%; overflow:hidden;
      background: var(--ink);
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 300;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content:'';
      position:fixed; inset:0; z-index:0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%,  rgba(212,175,55,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(212,175,55,0.04) 0%, transparent 60%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.008) 2px, rgba(255,255,255,0.008) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(255,255,255,0.004) 60px, rgba(255,255,255,0.004) 61px);
      pointer-events:none;
    }

    .stage {
      position:relative; z-index:1;
      width:100%; height:100%;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:24px 20px;
    }

    .header {
      text-align:center;
      margin-bottom:clamp(32px, 6vh, 52px);
      animation: fadeDown 1.2s ease both;
    }

    .brand-en {
      font-family:'IM Fell English', serif;
      font-style:italic;
      font-size:clamp(11px,2.5vw,13px);
      letter-spacing:6px;
      color:var(--gold);
      opacity:0.7;
      margin-bottom:10px;
      display:block;
    }

    .brand-jp {
      font-family:'Kaisei Decol', serif;
      font-size:clamp(36px, 8vw, 58px);
      letter-spacing:12px;
      color:var(--gold);
      line-height:1;
      display:block;
      text-shadow: 0 0 60px rgba(212,175,55,0.3);
    }

    .brand-sub {
      font-size:clamp(10px,2vw,12px);
      letter-spacing:4px;
      color:var(--dim);
      margin-top:12px;
      display:block;
    }

    .divider {
      width:1px; height:clamp(20px,3vh,32px);
      background:linear-gradient(to bottom, transparent, var(--gold-dim), transparent);
      margin:0 auto 0;
    }

    .gates {
      display:flex;
      gap:clamp(10px,2.5vw,20px);
      justify-content:center;
      align-items:stretch;
      width:100%;
      max-width:820px;
    }

    .gate {
      flex:1;
      min-width:0;
      max-width:260px;
      background: var(--paper);
      border:1px solid var(--gold-dim);
      border-radius:4px;
      padding:clamp(20px,4vh,32px) clamp(14px,3vw,24px);
      cursor:pointer;
      position:relative;
      overflow:hidden;
      transition:border-color 0.4s, background 0.4s, transform 0.3s;
      text-align:center;
      text-decoration:none; /* リンクの下線を消す */
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      -webkit-tap-highlight-color:transparent;
    }

    .gate::before, .gate::after {
      content:'';
      position:absolute;
      width:12px; height:12px;
      border-color:var(--gold);
      border-style:solid;
      opacity:0.4;
      transition:opacity 0.3s;
    }
    .gate::before { top:8px; left:8px;  border-width:1px 0 0 1px; }
    .gate::after  { bottom:8px; right:8px; border-width:0 1px 1px 0; }

    .gate:hover {
      border-color:rgba(212,175,55,0.6);
      background:rgba(212,175,55,0.06);
      transform:translateY(-3px);
    }
    .gate:hover::before, .gate:hover::after { opacity:1; }

    .gate:nth-child(1) { animation:fadeUp 0.9s 0.3s ease both; }
    .gate:nth-child(2) { animation:fadeUp 0.9s 0.5s ease both; }
    .gate:nth-child(3) { animation:fadeUp 0.9s 0.7s ease both; }

    .gate-icon {
      font-size:clamp(24px,5vw,32px);
      line-height:1;
      margin-bottom:4px;
    }

    .gate-name-jp {
      font-family:'Kaisei Decol', serif;
      font-size:clamp(16px,3.5vw,20px);
      letter-spacing:4px;
      color:var(--gold);
      display:block;
    }

    .gate-name-en {
      font-family:'IM Fell English', serif;
      font-style:italic;
      font-size:clamp(9px,1.8vw,11px);
      letter-spacing:3px;
      color:var(--dim);
      display:block;
      margin-top:2px;
    }

    .gate-desc {
      font-size:clamp(10px,1.8vw,11px);
      letter-spacing:1px;
      color:var(--dim);
      line-height:1.8;
      margin-top:4px;
    }

    .footer {
      margin-top:clamp(24px,4vh,40px);
      font-size:10px;
      letter-spacing:3px;
      color:rgba(232,224,208,0.2);
      animation:fadeUp 1s 0.9s ease both;
    }

    @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

    .particle {
      position:fixed; border-radius:50%;
      background:var(--gold); opacity:0;
      pointer-events:none; z-index:0;
      animation:float linear infinite;
    }
    @keyframes float {
      0%   { opacity:0; transform:translateY(100vh) scale(0); }
      10%  { opacity:0.4; }
      90%  { opacity:0.2; }
      100% { opacity:0; transform:translateY(-10vh) scale(1); }
    }
  </style>
</head>
<body>

<div id="particles"></div>

<div class="stage">
  <div class="header">
    <span class="brand-en">MAGATOKI Laboratory</span>
    <span class="brand-jp">香訪</span>
    <span class="brand-sub" id="brand-sub">Kouoh AR — 香りと縁を結ぶ</span>
  </div>

  <div class="divider"></div>

  <div class="gates" style="margin-top:clamp(20px,4vh,36px);">
    <a class="gate" href="./viewer.html" id="gate-viewer">
      <div class="gate-icon">🪬</div>
      <span class="gate-name-jp" id="gv-jp">香りの扉</span>
      <span class="gate-name-en">AR Viewer</span>
      <p class="gate-desc" id="gv-desc">空蝉・夕顔の<br>香りのアバターを召喚する</p>
    </a>

    <a class="gate" href="./viewer_plane.html" id="gate-plane">
      <div class="gate-icon">✨</div>
      <span class="gate-name-jp" id="gp-jp">空間の扉</span>
      <span class="gate-name-en">Plane AR</span>
      <p class="gate-desc" id="gp-desc">平らな場所に<br>香りの精を呼び出す</p>
    </a>

    <a class="gate" href="./store.html" id="gate-store">
      <div class="gate-icon">⛩️</div>
      <span class="gate-name-jp" id="gs-jp">購入の扉</span>
      <span class="gate-name-en">Store</span>
      <p class="gate-desc" id="gs-desc">NFT購入証明と<br>香りの縁を結ぶ</p>
    </a>
  </div>

  <div class="footer" id="footer-text">
    MAGATOKI Laboratory &nbsp;|&nbsp; kouoh-ar-nft.vercel.app
  </div>
</div>

<script>
'use strict';
var LANG = navigator.language && navigator.language.startsWith('ja') ? 'ja' : 'en';
var I18N = {
  ja: {
    'brand-sub': '香訪 AR — 香りと縁を結ぶ',
    'gv-jp': '香りの扉',
    'gv-desc': '空蝉・夕顔の\n香りのアバターを召喚する',
    'gp-jp': '空間の扉',
    'gp-desc': '平らな場所に\n香りの精を呼び出す',
    'gs-jp': '購入の扉',
    'gs-desc': 'NFT購入証明と\n香りの縁を結ぶ'
  },
  en: {
    'brand-sub': 'Kouoh AR — Bound by Lingering Scent',
    'gv-jp': 'AR Viewer',
    'gv-desc': 'Summon Utsusemi & Yugao,\nthe fragrance avatars',
    'gp-jp': 'Plane AR',
    'gp-desc': 'Place the scent spirit\nupon any flat surface',
    'gs-jp': 'Store',
    'gs-desc': 'NFT certification\n& purchase experience'
  }
};

function applyI18N() {
  var t = I18N[LANG] || I18N.ja;
  Object.keys(t).forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = t[id].replace(/\n/g, '<br>');
  });
  document.documentElement.lang = LANG === 'ja' ? 'ja' : 'en';
}
applyI18N();

(function initParticles() {
  var container = document.getElementById('particles');
  for (var i = 0; i < 18; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    var size = 1 + Math.random() * 2;
    p.style.width  = size + 'px';
    p.style.height = size + 'px';
    p.style.left   = Math.random() * 100 + 'vw';
    p.style.animationDuration  = (12 + Math.random() * 20) + 's';
    p.style.animationDelay     = -(Math.random() * 20) + 's';
    p.style.opacity = (0.1 + Math.random() * 0.3).toString();
    container.appendChild(p);
  }
})();
</script>
</body>
</html>
